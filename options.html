<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Configuración - Mi Extensión</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      max-width: 520px;
      margin: 40px auto;
      padding: 24px;
      background: #f8fafc;
      color: #1e293b;
    }
    .panel {
      background: #ffffff;
      border: 1px solid #e2e8f0;
      border-radius: 12px;
      padding: 24px;
      box-shadow: 0 4px 6px -1px rgba(0,0,0,0.05);
    }
    h1 {
      font-size: 1.4rem;
      margin-bottom: 8px;
    }
    p {
      color: #64748b;
      font-size: 0.9rem;
      margin-bottom: 20px;
    }
    .form-group {
      margin-bottom: 16px;
    }
    label {
      display: block;
      font-weight: 600;
      font-size: 0.85rem;
      margin-bottom: 6px;
    }
    input[type="text"] {
      width: 100%;
      box-sizing: border-box;
      padding: 10px 12px;
      border: 1px solid #cbd5e1;
      border-radius: 6px;
      font-size: 0.9rem;
    }
    .checkbox-group {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-top: 12px;
    }
    button {
      background: #2563eb;
      color: white;
      border: none;
      padding: 10px 18px;
      border-radius: 6px;
      font-weight: 600;
      cursor: pointer;
      margin-top: 10px;
    }
    button:hover {
      background: #1d4ed8;
    }
    #status {
      margin-top: 12px;
      font-size: 0.85rem;
      color: #10b981;
      font-weight: 600;
    }
  </style>
</head>
<body>
  <div class="panel">
    <h1>⚙️ Opciones de Configuración</h1>
    <p>Ajusta las preferencias de tu extensión aquí.</p>

    <div class="form-group">
      <label for="userName">Tu nombre o alias:</label>
      <input type="text" id="userName" placeholder="Ej: Juan Pérez">
    </div>

    <div class="form-group checkbox-group">
      <input type="checkbox" id="notificationsEnabled">
      <label for="notificationsEnabled" style="margin: 0;">Habilitar notificaciones automáticas</label>
    </div>

    <button id="saveBtn">Guardar cambios</button>
    <div id="status"></div>
  </div>

  <script src="options.js"></script>
</body>
</html>
